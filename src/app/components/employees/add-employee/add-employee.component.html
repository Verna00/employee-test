

  <form [formGroup]="employeeForm" (ngSubmit)="saveEmployee(employeeForm.value)" class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow-md">
    <div class="mb-6">
      <h3 class="text-2xl font-bold text-gray-800">Create New Employee</h3>
    </div>
  
    <!-- Personal Info Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <!-- Name Field -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input type="text" formControlName="name" autocomplete="name"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span *ngIf="(employeeForm.get('name')?.touched || employeeForm.get('name')?.dirty) && employeeForm.get('name')?.errors"
              class="text-sm text-red-600">Name is required</span>
      </div>
  
      <!-- ID Field -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ID</label>
        <input type="number" formControlName="id" autocomplete="id"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span *ngIf="(employeeForm.get('id')?.touched || employeeForm.get('id')?.dirty) && employeeForm.get('id')?.errors"
              class="text-sm text-red-600">ID is required</span>
      </div>
  
      <!-- Phone Field -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input type="text" formControlName="phone" autocomplete="phone"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span *ngIf="(employeeForm.get('phone')?.touched || employeeForm.get('phone')?.dirty) && employeeForm.get('phone')?.errors"
              class="text-sm text-red-600">Phone is required</span>
      </div>
    </div>
  
    <!-- Address Section -->
    <div class="mb-6">
      <h4 class="text-lg font-semibold text-gray-800 mb-4">Address:</h4>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Street -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Street</label>
          <input type="text" formControlName="street" autocomplete="street"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <span *ngIf="(employeeForm.get('address.street')?.touched || employeeForm.get('address.street')?.dirty) && employeeForm.get('address.street')?.errors"
                class="text-sm text-red-600">Street is required</span>
        </div>
  
        <!-- City -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input type="text" formControlName="city" autocomplete="city"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <span *ngIf="(employeeForm.get('address.city')?.touched || employeeForm.get('address.city')?.dirty) && employeeForm.get('address.city')?.errors"
                class="text-sm text-red-600">City is required</span>
        </div>
  
        <!-- State -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
          <input type="text" formControlName="state" autocomplete="state"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <span *ngIf="(employeeForm.get('address.state')?.touched || employeeForm.get('address.state')?.dirty) && employeeForm.get('address.state')?.errors"
                class="text-sm text-red-600">State is required</span>
        </div>
  
        <!-- Postcode -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Postcode</label>
          <input type="text" formControlName="PostCode" autocomplete="PostCode"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <span *ngIf="(employeeForm.get('address.PostCode')?.touched || employeeForm.get('address.PostCode')?.dirty) && employeeForm.get('address.PostCode')?.errors"
                class="text-sm text-red-600">Postcode is required</span>
        </div>
      </div>
    </div>
  
    <!-- Buttons -->
    <div class="flex justify-end space-x-4">
      <button type="button" (click)="cancel()"
              class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Cancel
      </button>
      <button type="submit" [disabled]="employeeForm.invalid"
              class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-300">
        Submit
      </button>
    </div>
  </form>
